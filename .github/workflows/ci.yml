name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Lab 10, bonus 3: run both test sets on demand, e.g. on a branch that changes the
  # database layer, before it is merged (Actions -> CI -> Run workflow -> branch).
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PLANTUML_VERSION: "1.2026.8"
      # SHA-256 jar-файлу з npm-пакета plantuml-cli@1.2026.8 — перевіряємо, що завантажили саме його.
      PLANTUML_SHA256: "5e1ecfa8ecd32c90b03bbf3b1eb6f020943f98ab0fcf4032be31a0002ee2c462"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Python is already installed on the Windows self-hosted runner.
      - name: Verify installed Python
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is not available on PATH' }
          python -c "import sys; assert sys.version_info >= (3, 12), 'Python 3.12+ required'"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.12 or newer is required' }

      - name: Set up Node.js for client tests and PlantUML
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check requirements consistency (Lab 2)
        run: python scripts/check_requirements.py

      # Lab 7 bonus: every test carries @pytest.mark.req with an ID from docs/requirements/rtm.md,
      # and every FR, NFR and derived requirement has a test or a recorded exemption (rtm.md,
      # section 7). Standard library only, so it runs before dependencies and fails fast.
      - name: Check requirement-test traceability (Lab 7)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/check_traceability.py
          if ($LASTEXITCODE -ne 0) { throw 'Traceability gap: fix the markers, the test or rtm.md' }

      # Lab 8: the version in pyproject.toml, the latest release in CHANGELOG.md and the
      # Keep a Changelog format must agree on every PR. Standard library only, runs early.
      - name: Check release metadata (Lab 8)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata mismatch: run python scripts/release.py check' }


      # Версії закріплено: інакше згенерована специфікація залежала б від машини.
      # pip-audit знайшов 4 вразливості в самому pip 26.0.1, який ставить python -m venv
      # (PYSEC-2026-196, -2875, -2876, -3721). Усі виправлені у 26.2 — звідси нижня межа.
      # Lab 10, bonus 2: the runner is persistent, so the environment is built once per
      # dependency set (key = Python + pip spec + requirements files) and reused while the
      # key is unchanged. Cache lives outside the workspace, separately for push and PR runs.
      - name: Install API dependencies (Lab 4; cached venv, Lab 10)
        env:
          PYTHONIOENCODING: utf-8
          EVENT: ${{ github.event_name }}
        run: |
          python scripts/ci_venv.py --requirements requirements-testing.txt --pip "pip>=26.2" --root "$env:RUNNER_TOOL_CACHE\ssdm12-venv" --scope $env:EVENT --github-env
          if ($LASTEXITCODE -ne 0) { throw 'Cached virtual environment is not ready' }

      # Lab 5 quality gates (charter 11.2). Static checks run before tests: they take seconds
      # and stop a broken change early. Configuration lives in pyproject.toml, .importlinter
      # and .secrets.baseline; the same tools run locally in .pre-commit-config.yaml.
      - name: Lint with Ruff (Lab 5)
        run: |
          & "$env:VENV_DIR\Scripts\ruff.exe" check src tests scripts --output-format=github
          if ($LASTEXITCODE -ne 0) { throw 'Ruff found violations: run ruff check --fix locally' }

      - name: Check formatting with Ruff (Lab 5)
        run: |
          & "$env:VENV_DIR\Scripts\ruff.exe" format --check src tests scripts
          if ($LASTEXITCODE -ne 0) { throw 'Unformatted files: run ruff format src tests scripts' }

      - name: Security scan with Bandit (Lab 5)
        run: |
          & "$env:VENV_DIR\Scripts\bandit.exe" -c pyproject.toml -r src scripts
          if ($LASTEXITCODE -ne 0) { throw 'Bandit reported a security issue' }

      # Every tracked file is checked against the audited baseline: a new secret fails the
      # build even if the commit was made in the GitHub web editor, where hooks do not run.
      # Exit code 3 means only line numbers in the baseline moved (no new secret): warn, pass.
      - name: Scan for secrets with detect-secrets (Lab 5)
        run: |
          $files = git ls-files
          if ($LASTEXITCODE -ne 0) { throw 'git ls-files failed' }
          & "$env:VENV_DIR\Scripts\detect-secrets-hook.exe" --baseline .secrets.baseline $files
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            Write-Host '::warning title=Secrets baseline::Line numbers are out of date; run detect-secrets scan --baseline .secrets.baseline and commit it'
            exit 0
          }
          if ($code -ne 0) { throw 'Potential secret found: remove it, or audit a false positive in .secrets.baseline' }

      # Audits the packages installed in the cached venv (application, test and analysis tools, pip)
      # and the MCP server dependencies. An accepted risk is passed as --ignore-vuln <ID>
      # together with a justification in docs/code-quality/static-analysis.md.
      - name: Audit dependencies with pip-audit (Lab 5)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          & "$env:VENV_DIR\Scripts\pip-audit.exe" --progress-spinner off
          if ($LASTEXITCODE -ne 0) { throw 'Vulnerable package installed in the venv' }
          & "$env:VENV_DIR\Scripts\pip-audit.exe" --progress-spinner off -r requirements-mcp.txt
          if ($LASTEXITCODE -ne 0) { throw 'Vulnerable package in requirements-mcp.txt' }

      # Architecture fitness function (HLD 6): contracts in .importlinter.
      - name: Check architecture contracts with import-linter (Lab 5)
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: |
          & "$env:VENV_DIR\Scripts\lint-imports.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Import contract broken: see HLD section 6' }

      # The build job remains the required PR check on the existing Windows runner.
      # Lab 10, bonus 3: build runs the FAST set on every PR and push - unit, API, property
      # and reliability tests, all in-process without external services. The SLOW set
      # (tests/integration, real PostgreSQL 16) runs in job `integration` after a merge.
      # The fast set alone covers ~79% of api+unislot, so the PR gate here is 78%; the 90%
      # gate of charter 11.4 is checked over both sets together in `integration`.
      # The full local equivalent is still: python scripts/run_lab06.py
      - name: Fast test set with branch coverage (Lab 10)
        run: |
          & "$env:VENV_DIR\Scripts\python.exe" -m pytest -q --ignore=tests/integration --junitxml=reports/junit-fast.xml --cov=api --cov=unislot --cov-branch --cov-report=term:skip-covered --cov-report=xml:coverage-fast.xml --cov-fail-under=78
          if ($LASTEXITCODE -ne 0) { throw 'Fast tests or the fast-set coverage gate (78%) failed' }

      # .coverage (hidden file) goes to `integration`, which appends the slow set to it.
      - name: Upload fast-set reports and coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-fast
          path: |
            .coverage
            coverage-fast.xml
            reports/junit-fast.xml
          include-hidden-files: true
          if-no-files-found: warn
          overwrite: true

      # Code-First: fail if the committed API docs differ from the generated files.
      - name: Check OpenAPI is generated from code (Lab 4)
        run: |
          & "$env:VENV_DIR\Scripts\python.exe" scripts/export_openapi.py --check
          if ($LASTEXITCODE -ne 0) { throw 'API docs differ from code. Run python scripts/export_openapi.py' }

      # Use ASCII source and Unicode escapes for Windows PowerShell 5.1 scripts.
      # Literal placeholder markers containing only spaces or an ellipsis are allowed.
      - name: Check author slots are filled in docs/api, docs/refactoring, docs/ci-cd, docs/requirements, docs/validation and CHANGELOG.md (Lab 4, Lab 7, Lab 8, Lab 10)
        run: |
          @'
          import re
          import sys
          from pathlib import Path

          # An unfilled slot is either a marker with words inside or a stub line
          # "Zapovniuie @<user>" (Ukrainian, escaped below) left in the Lab 8 report.
          pattern = re.compile(
              r"\u2039(?![\s\u2026]*\u203a)|\u0417\u0430\u043f\u043e\u0432\u043d\u044e\u0454 @"
          )
          matches = [
              f"{path.as_posix()}:{number}: {line.strip()}"
              for path in sorted(
                  [*Path("docs/api").glob("*.md"), *Path("docs/refactoring").glob("*.md"),
                   *Path("docs/ci-cd").rglob("*.md"), *Path("docs/requirements").rglob("*.md"),
                   *Path("docs/validation").rglob("*.md"), Path("CHANGELOG.md")]
              )
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1)
              if pattern.search(line)
          ]
          if matches:
              print("\n".join(matches))
              print("::error::Fill author placeholders before merging.")
              sys.exit(1)
          print("[ ok ] No unfilled author placeholders in docs/api, docs/refactoring, docs/ci-cd, docs/requirements, docs/validation, CHANGELOG.md.")
          '@ | & "$env:VENV_DIR\Scripts\python.exe" -
          if ($LASTEXITCODE -ne 0) { throw 'Unfilled author placeholders in docs' }

      - name: Set up Java for PlantUML
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download PlantUML and verify checksum
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd pack "plantuml-cli@$env:PLANTUML_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $archive = "plantuml-cli-$env:PLANTUML_VERSION.tgz"
          tar.exe -xzf $archive
          if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          $jarPath = Join-Path (Get-Location).Path ("package\build\plantuml-{0}.jar" -f $env:PLANTUML_VERSION)
          if (-not (Test-Path -LiteralPath $jarPath -PathType Leaf)) { throw "PlantUML jar missing: $jarPath" }
          # Use .NET directly: Get-FileHash may be unavailable in the runner's PowerShell modules.
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $stream = [System.IO.File]::OpenRead($jarPath)
            try {
              $actualHash = [System.BitConverter]::ToString($sha256.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
            } finally {
              $stream.Dispose()
            }
          } finally {
            $sha256.Dispose()
          }
          if ($actualHash -ne $env:PLANTUML_SHA256) { throw 'PlantUML SHA256 mismatch' }
          "PLANTUML_JAR=$jarPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # --strict: незаповнені місця «‹…›» у нотатках ШІ — порушення (статут §8.3).
      - name: Check architecture artifacts and diagram syntax (Lab 3)
        run: python scripts/check_architecture.py --plantuml "$env:PLANTUML_JAR" --strict

  reliability:
    name: reliability
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    env:
      PYTHONIOENCODING: utf-8
      UNISLOT_DATABASE_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Lab 10, bonus 2: the same cached environment as in build (same key, same scope).
      - name: Install test dependencies (cached venv, Lab 10)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python scripts/ci_venv.py --requirements requirements-testing.txt --pip "pip>=26.2" --root "$env:RUNNER_TOOL_CACHE\ssdm12-venv" --scope $env:EVENT --github-env
          if ($LASTEXITCODE -ne 0) { throw 'Cached virtual environment is not ready' }
      - name: Run reliability tests
        run: |
          & "$env:VENV_DIR\Scripts\python.exe" -m pytest -q tests/reliability
          if ($LASTEXITCODE -ne 0) { throw 'Reliability tests failed' }

  # Lab 10, bonus 3: the SLOW set - PostgreSQL integration tests against a real local
  # PostgreSQL 16 cluster (scripts/postgres_dev.py) - after a merge to main or on a manual
  # run, never on a pull request. A defect that only this set finds turns main red after
  # the merge: that is the price of faster PR feedback (counted in the change fail rate).
  integration:
    name: integration
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test dependencies (cached venv, Lab 10)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python scripts/ci_venv.py --requirements requirements-testing.txt --pip "pip>=26.2" --root "$env:RUNNER_TOOL_CACHE\ssdm12-venv" --scope $env:EVENT --github-env
          if ($LASTEXITCODE -ne 0) { throw 'Cached virtual environment is not ready' }

      - name: Verify PostgreSQL integration test prerequisites
        run: |
          @'
          import subprocess
          from scripts.postgres_dev import postgres_bin

          directory = postgres_bin()
          for name in ("initdb.exe", "pg_ctl.exe", "postgres.exe"):
              if not (directory / name).is_file():
                  raise SystemExit("PostgreSQL binary missing: " + name)
          version = subprocess.check_output(
              [str(directory / "postgres.exe"), "--version"], text=True
          ).strip()
          print(version)
          if " 16." not in version:
              raise SystemExit("PostgreSQL 16 binaries required for integration tests")
          '@ | & "$env:VENV_DIR\Scripts\python.exe" -
          if ($LASTEXITCODE -ne 0) { throw 'Install PostgreSQL 16 or configure UNISLOT_POSTGRES_BIN on the runner' }

      - name: Download fast-set coverage data
        uses: actions/download-artifact@v4
        with:
          name: tests-fast
          path: .

      - name: Slow test set - PostgreSQL integration, gate 90% over both sets (Lab 10)
        run: |
          & "$env:VENV_DIR\Scripts\python.exe" -m pytest -q tests/integration --junitxml=reports/junit-slow.xml --cov=api --cov=unislot --cov-branch --cov-append --cov-report=term:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=90
          if ($LASTEXITCODE -ne 0) { throw 'Integration tests or the 90% coverage gate over both sets failed' }

      - name: Upload slow-set reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-slow
          path: |
            coverage.xml
            reports/junit-slow.xml
          if-no-files-found: warn
          overwrite: true
