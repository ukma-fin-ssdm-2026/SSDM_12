          type: string
          title: Name
          description: Назва ресурсу.
        type:
          $ref: '#/components/schemas/ResourceType'
          description: 'Тип: consultation або room.'
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacity
          description: Місткість аудиторії; для консультацій — null (INV-08).
        provider:
          $ref: '#/components/schemas/PersonSummary'
          description: Провайдер, який керує доступністю ресурсу (FR-061).
      type: object
      required:
      - id
      - name
      - type
      - capacity
      - provider
      title: ResourceOut
      description: 'Ресурс каталогу: консультація викладача або аудиторія.'
      examples:
      - capacity: 30
        id: a9877c74-ace0-4fb3-8703-c97776347c65
        name: Аудиторія 1-225
        provider:
          full_name: Олег Бондар
          id: 6aafc85c-a8aa-4ae7-bd80-dba04d79baa3
        type: room
    ResourceSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Ідентифікатор ресурсу.
          examples:
          - e5a7657b-0de4-4984-92f4-72b74ade3e3a
        name:
          type: string
          title: Name
          description: Назва ресурсу.
          examples:
          - Консультація з баз даних
        type:
          $ref: '#/components/schemas/ResourceType'
          description: 'Тип ресурсу: consultation або room.'
        capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Capacity
          description: Місткість; лише для аудиторій (INV-08), для консультацій — null.
          examples:
          - null
      type: object
      required:
      - id
      - name
      - type
      - capacity
      title: ResourceSummary
      description: Короткий опис ресурсу всередині слота чи бронювання.
    ResourceType:
      type: string
      enum:
      - consultation
      - room
      title: ResourceType
      description: 'Тип ресурсу (глосарій): консультація викладача або аудиторія.'
    ResourceUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 120
            minLength: 1
          - type: 'null'
          title: Name
          description: Нова назва.
        capacity:
          anyOf:
          - type: integer
            maximum: 1000.0
            minimum: 1.0
          - type: 'null'
          title: Capacity
          description: Нова місткість; лише для аудиторій.
        provider_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Provider Id
          description: Новий провайдер (INV-15).
      additionalProperties: false
      type: object
      title: ResourceUpdate
      description: 'Часткове оновлення ресурсу: змінюються лише передані поля (PATCH).'
      examples:
      - capacity: 28
      - name: Аудиторія 1-225 (оновлена)
    Role:
      type: string
      enum:
      - student
      - provider
      - admin
      title: Role
      description: Роль користувача (FR-007). Користувач може мати кілька ролей (`user_role`).
    SlotCreate:
      properties:
        starts_at:
          type: string
          format: date-time
          title: Starts At
          description: Початок слота з часовим поясом (RFC 3339), наприклад +02:00 для Києва взимку. Час
            без поясу відхиляється.
        duration_minutes:
          type: integer
          multipleOf: 5.0
          maximum: 120.0
          minimum: 15.0
          title: Duration Minutes
          description: 'Тривалість: 15–120 хв із кроком 5 хв (A-005).'
      additionalProperties: false
      type: object
      required:
      - starts_at
      - duration_minutes
      title: SlotCreate
      description: Новий разовий слот на ресурсі провайдера (FR-010).
