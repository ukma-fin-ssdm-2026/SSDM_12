        Місткість обов'язкова лише для аудиторії (INV-08); провайдер має мати роль
        «провайдер» (INV-15). Дія потрапляє в журнал аудиту (FR-066).
      operationId: create_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreate'
            examples:
              room:
                summary: Аудиторія з місткістю
                value:
                  name: Аудиторія 2-110
                  type: room
                  capacity: 24
                  provider_id: 6aafc85c-a8aa-4ae7-bd80-dba04d79baa3
              consultation:
                summary: Консультація без місткості
                value:
                  name: Консультація з алгоритмів
                  type: consultation
                  provider_id: 70acfde3-99e4-4c20-93e1-aeaf0af2cfec
              not_provider:
                summary: 'Помилка: провайдер — студент (422)'
                value:
                  name: Аудиторія 2-111
                  type: room
                  capacity: 20
                  provider_id: 3c357b14-bd0d-424b-8924-17eb737a4907
        required: true
      responses:
        '201':
          description: Ресурс створено; заголовок Location містить його адресу.
          headers:
            Location:
              description: Адреса створеного ресурсу.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції

            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
