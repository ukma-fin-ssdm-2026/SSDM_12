                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
