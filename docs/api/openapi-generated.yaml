        has_more:
          type: boolean
          title: Has More
          description: Чи є ще елементи після цієї сторінки.
          examples:
          - false
      type: object
      required:
      - limit
      - offset
      - total
      - has_more
      title: OffsetPagination
      description: Метадані сторінки за зсувом.
    PersonSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
