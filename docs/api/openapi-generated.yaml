          type: string
          format: uuid
          description: Ресурс провайдера, на якому створюється слот.
          title: Resource Id
        description: Ресурс провайдера, на якому створюється слот.
        examples:
          own:
            summary: 'Власний ресурс demo-provider: консультація з баз даних'
            value: e5a7657b-0de4-4984-92f4-72b74ade3e3a
          foreign:
