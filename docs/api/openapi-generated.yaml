  /api/v1/bookings/{booking_id}/reschedule:
    post:
      tags:
      - bookings
      summary: Перенести бронювання на інший слот
      description: |-
        Атомарно замінює бронювання новим (FR-043): старе стає `cancelled` з видом
        `rescheduled` і посиланням `rescheduled_to_id`, нове повертається з кодом 201.
        Якщо новий слот зайнятий чи недоступний, нічого не змінюється. Діє те саме вікно, що
        й для скасування; перенесення не рахується як нове бронювання в ліміті A-002 (FR-044).
      operationId: reschedule_booking
      security:
      - demoBearer: []
      - sessionCookie: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор бронювання (UUID).
          title: Booking Id
        description: Ідентифікатор бронювання (UUID).
        examples:
          active:
            summary: Власне активне бронювання (demo-student)
            value: 31c7764f-006e-49e4-b5bb-12d90e9e1cc5
          deadline_passed:
            summary: Власне, граничний час скасування вже минув (demo-student)
            value: 6982feb7-e3d9-4e36-8a61-f05bc39c4685
          foreign:
            summary: Бронювання іншого студента (demo-student-2)
            value: e53719cf-dcd8-4c2f-824b-7ae4e53a1bac
      - name: X-CSRF-Token
        in: header
        required: false
        description: Обов'язковий для cookie-сесії; значення з /auth/login або unislot_csrf cookie. Для
          явно ввімкненого demoBearer не потрібний.
        schema:
          type: string
          minLength: 43
          maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
            examples:
              free:
                summary: На вільний слот → 201
                value:
                  new_slot_id: e2600697-bce7-4396-a78d-bbe9bdff9212
              taken:
                summary: На зайнятий слот → 409, старе бронювання лишається
                value:
                  new_slot_id: 620cd53b-a9d3-4873-9e19-3ca78f0b389b
      responses:
        '201':
          description: Нове бронювання; старе стало cancelled з видом rescheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
          headers:
            Location:
              description: Адреса створеного бронювання.
              schema:
                type: string
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
            - `NOT_OWNER` — Об'єкт належить іншому користувачу

            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
