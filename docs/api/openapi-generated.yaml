      type: object
      required:
      - id
      - full_name
      - email
      - roles
      title: MeOut
      description: Поточний користувач і його ролі (FR-007).
    OffsetPagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: Розмір сторінки, який застосовано.
