    власних бронювань (US-014).
- name: admin
  description: Ролі користувачів і політики бронювання (FR-062…065).
- name: availability
  description: Тижневі шаблони й блокування власного ресурсу (US-008/009).
- name: notifications
  description: Особиста скринька заглушки доставки (C-002).
- name: workspace
  description: Приватні списки даних для провайдера й адміністратора.
