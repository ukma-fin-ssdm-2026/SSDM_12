                NOT_OWNER:
                  summary: Об'єкт належить іншому користувачу
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#not-owner
                    title: Об'єкт належить іншому користувачу
                    status: 403
                    detail: Студент звертається до чужого бронювання або провайдер — до чужого ресурсу.
                      Відповідь не містить даних об'єкта (THR-03).
                    code: NOT_OWNER
                    action: Відкрийте власний об'єкт; доступ до чужих даних заборонено.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                CSRF_FAILED:
                  summary: Не пройдено перевірку запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#csrf-failed
                    title: Не пройдено перевірку запиту
                    status: 403
                    detail: Джерело запиту або CSRF-токен не пройшли перевірку.
                    code: CSRF_FAILED
                    action: Оновіть сторінку та передайте чинний X-CSRF-Token.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
