        cancel_deadline_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancel Deadline At
          description: Граничний час скасування бронювання, UTC (FR-041).
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - action
      - request_id
      title: Problem
