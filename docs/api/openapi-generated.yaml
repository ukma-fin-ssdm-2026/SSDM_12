                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#not-owner
                    title: Об'єкт належить іншому користувачу
                    status: 403
                    detail: Студент звертається до чужого бронювання або провайдер — до чужого ресурсу.
                      Відповідь не містить даних об'єкта (THR-03).
                    code: NOT_OWNER
                    action: Відкрийте власний об'єкт; доступ до чужих даних заборонено.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |-
            Можливі причини:

            - `RESOURCE_NOT_FOUND` — Ресурс не знайдено
          content:
            application/problem+json:
              examples:
                RESOURCE_NOT_FOUND:
                  summary: Ресурс не знайдено
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#resource-not-found
                    title: Ресурс не знайдено
                    status: 404
                    detail: Ресурсу (консультації чи аудиторії) з таким ідентифікатором немає.
                    code: RESOURCE_NOT_FOUND
                    action: Оберіть ресурс із каталогу GET /api/v1/resources.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          content:
            application/problem+json:
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
  /api/v1/admin/audit:
    get:
      tags:
      - workspace
      summary: Переглянути журнал адміністративних змін із фільтрами
      description: 'FR-068: лише читання; паролі й токени не повертаються навіть із помилкового payload.'
      operationId: audit_log
      security:
      - demoBearer: []
      - sessionCookie: []
      parameters:
      - name: actor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Лише дії вказаного автора.
          title: Actor Id
        description: Лише дії вказаного автора.
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          description: Точна назва, наприклад resource.update.
          title: Action
        description: Точна назва, наприклад resource.update.
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Початкова київська дата; стандартно сьогодні.
          title: Date From
        description: Початкова київська дата; стандартно сьогодні.
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Кінцева дата включно, максимум 31 день.
          title: Date To
        description: Кінцева дата включно, максимум 31 день.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Скільки елементів повернути (1–100).
          default: 20
          title: Limit
        description: Скільки елементів повернути (1–100).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          description: Скільки елементів пропустити від початку списку.
          default: 0
          title: Offset
        description: Скільки елементів пропустити від початку списку.
      responses:
        '200':
          description: Незмінні події, від нових до старих; доступні лише адміністратору.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditList'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          content:
            application/problem+json:
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
components:
  schemas:
    AccountList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AccountOut'
          type: array
          title: Items
          description: Користувачі за ім'ям, потім за ID.
        pagination:
          $ref: '#/components/schemas/OffsetPagination'
          description: Метадані сторінки.
      type: object
      required:
      - items
      - pagination
      title: AccountList
      description: Сторінка користувачів; не розкриває хешів, сесій чи лічильників входу.
    AccountOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Ідентифікатор користувача.
          examples:
          - 3c357b14-bd0d-424b-8924-17eb737a4907
        full_name:
          type: string
          title: Full Name
          description: Повне ім'я.
          examples:
          - Олена Коваль
        email:
          type: string
          title: Email
          description: Адреса електронної пошти (лише власна).
          examples:
          - olena.koval@unislot.example
        roles:
          items:
            $ref: '#/components/schemas/Role'
          type: array
          title: Roles
          description: Ролі користувача; їх може бути кілька (AQ-01). Відсортовано за назвою.
          examples:
          - - student
        is_active:
          type: boolean
          title: Is Active
          description: Чи дозволено парольний вхід до облікового запису.
      type: object
      required:
      - id
      - full_name
      - email
      - roles
      - is_active
      title: AccountOut
      description: Видимий тільки адміністратору запис каталогу користувачів.
    AuditEntry:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: Постійний UUID; null лише для старого демо-запису.
        actor_id:
          type: string
          format: uuid
          title: Actor Id
          description: ID автора адміністративної дії.
        actor_name:
          type: string
          title: Actor Name
          description: Ім'я автора, доступне лише адміністратору.
        action:
          type: string
          title: Action
          description: Машинна назва дії.
        object_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Object Id
          description: ID об'єкта зміни.
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
          description: Значення до зміни без секретів Auth.
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
          description: Значення після зміни без секретів Auth.
        at:
          type: string
          format: date-time
          title: At
          description: Момент події у UTC.
      type: object
      required:
      - id
      - actor_id
      - actor_name
      - action
      - object_id
      - before
      - after
      - at
      title: AuditEntry
      description: Адміністративна подія; читання не дозволяє її змінювати.
    AuditList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditEntry'
          type: array
          title: Items
          description: Події журналу.
        pagination:
          $ref: '#/components/schemas/OffsetPagination'
          description: Метадані сторінки.
      type: object
      required:
      - items
      - pagination
      title: AuditList
      description: 'FR-068: відфільтровані записи від нових до старих.'
    BookingCreate:
      properties:
        slot_id:
          type: string
          format: uuid
          title: Slot Id
          description: Слот, який бронює студент (з результатів пошуку).
      additionalProperties: false
      type: object
      required:
      - slot_id
      title: BookingCreate
      description: Запит на бронювання вільного слота.
      examples:
      - slot_id: e3b8b6ab-fc35-4091-90f0-2500b6a546a4
    BookingList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BookingOut'
          type: array
          title: Items
          description: 'Бронювання: спершу активні й ті, що тривають (найближчі першими), потім завершені
