                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    errors:
                    - field: query.state
                      message: Input should be 'active', 'in_progress', 'completed' or 'cancelled'
                      type: enum
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    BookingCreate:
      properties:
        slot_id:
          type: string
          format: uuid
          title: Slot Id
          description: Слот, який бронює студент (з результатів пошуку).
      additionalProperties: false
      type: object
      required:
      - slot_id
      title: BookingCreate
      description: Запит на бронювання вільного слота.
      examples:
      - slot_id: e3b8b6ab-fc35-4091-90f0-2500b6a546a4
    BookingList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BookingOut'
          type: array
          title: Items
          description: 'Бронювання: спершу активні й ті, що тривають (найближчі першими), потім завершені
            й скасовані (найновіші першими) — US-014.'
        pagination:
          $ref: '#/components/schemas/OffsetPagination'
          description: Метадані сторінки.
      type: object
      required:
      - items
      - pagination
      title: BookingList
      description: Сторінка власних бронювань студента.
    BookingOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Ідентифікатор бронювання (UUID).
        state:
          $ref: '#/components/schemas/BookingState'
          description: 'Похідний стан: active — слот ще не почався; in_progress — триває (AQ-05); completed
            — завершився; cancelled — скасоване.'
        slot:
          $ref: '#/components/schemas/BookingSlot'
          description: Слот бронювання.
        resource:
          $ref: '#/components/schemas/ResourceSummary'
          description: Ресурс слота.
        provider:
          $ref: '#/components/schemas/PersonSummary'
          description: Провайдер ресурсу.
        cancel_deadline_at:
          type: string
          format: date-time
          title: Cancel Deadline At
          description: Граничний час скасування й перенесення, UTC. Фіксується під час бронювання й не
            змінюється, якщо адміністратор змінить політику (FR-041, FR-065).
        can_cancel:
          type: boolean
          title: Can Cancel
          description: Чи можна зараз скасувати або перенести бронювання (стан active і граничний час
            ще не минув). Інтерфейс показує дії лише тоді, коли true (US-014).
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Коли створено бронювання, UTC.
        cancelled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancelled At
          description: Коли скасовано; лише для cancelled.
        cancellation_kind:
          anyOf:
          - $ref: '#/components/schemas/CancellationKind'
          - type: 'null'
          description: 'Хто або що скасувало: student, provider_block, rescheduled.'
        cancellation_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancellation Reason
          description: Причина від провайдера; лише для provider_block (FR-014).
        rescheduled_to_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Rescheduled To Id
          description: Нове бронювання, якщо це бронювання перенесено (FR-043).
      type: object
      required:
      - id
      - state
      - slot
      - resource
      - provider
      - cancel_deadline_at
      - can_cancel
      - created_at
      title: BookingOut
      description: Бронювання з погляду його власника-студента.
      examples:
      - can_cancel: true
        cancel_deadline_at: '2026-10-21T05:00:00Z'
        created_at: '2026-10-19T09:15:00Z'
        id: 31c7764f-006e-49e4-b5bb-12d90e9e1cc5
        provider:
          full_name: Ірина Шевченко
          id: 70acfde3-99e4-4c20-93e1-aeaf0af2cfec
        resource:
          id: e5a7657b-0de4-4984-92f4-72b74ade3e3a
          name: Консультація з баз даних
          type: consultation
        slot:
          ends_at: '2026-10-21T07:30:00Z'
          id: acd61ab7-b720-4d4a-9c29-d2f7c5593d3e
          starts_at: '2026-10-21T07:00:00Z'
        state: active
    BookingReschedule:
      properties:
        new_slot_id:
          type: string
          format: uuid
          title: New Slot Id
          description: Вільний слот, на який переноситься бронювання.
      additionalProperties: false
      type: object
      required:
      - new_slot_id
      title: BookingReschedule
      description: Запит на перенесення бронювання на інший слот.
      examples:
      - new_slot_id: e2600697-bce7-4396-a78d-bbe9bdff9212
    BookingSlot:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Ідентифікатор слота.
        starts_at:
          type: string
          format: date-time
          title: Starts At
          description: Початок, UTC.
        ends_at:
          type: string
          format: date-time
          title: Ends At
          description: Кінець, UTC.
      type: object
      required:
      - id
      - starts_at
      - ends_at
      title: BookingSlot
      description: Час слота бронювання.
    BookingState:
      type: string
      enum:
      - active
      - in_progress
      - completed
      - cancelled
      title: BookingState
      description: |-
        Похідний стан бронювання для користувача (`data-model.md` §7, AQ-05).

        Обчислюється з `status` і часу слота; у БД не зберігається.
    CancellationKind:
      type: string
      enum:
      - student
      - provider_block
      - rescheduled
      title: CancellationKind
      description: Хто або що скасувало бронювання (INV-13).
    CursorPagination:
      properties:
        limit:
          type: integer
          title: Limit
          description: Розмір сторінки, який застосовано.
          examples:
          - 20
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Непрозорий курсор наступної сторінки; null, якщо сторінка остання.
          examples:
          - eyJzIjoiMjAyNi0xMC0yMFQwODozMDowMCswMDowMCIsImkiOiIuLi4ifQ
        has_more:
          type: boolean
          title: Has More
          description: Чи є наступна сторінка.
          examples:
          - true
      type: object
      required:
      - limit
      - next_cursor
      - has_more
      title: CursorPagination
      description: Метадані сторінки за курсором.
    ErrorCode:
      type: string
      enum:
      - VALIDATION_FAILED
      - BAD_REQUEST
      - AUTH_REQUIRED
      - FORBIDDEN_ROLE
      - NOT_OWNER
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - RESOURCE_NOT_FOUND
      - SLOT_NOT_FOUND
      - BOOKING_NOT_FOUND
      - SLOT_ALREADY_BOOKED
      - SLOT_STARTED
      - SLOT_OUT_OF_HORIZON
      - SLOT_BLOCKED
      - BOOKING_LIMIT_REACHED
      - BOOKING_OVERLAP
      - BOOKING_ALREADY_CANCELLED
      - CANCELLATION_DEADLINE_PASSED
      - SLOT_OVERLAP
      - SLOT_IN_PAST
      - DATE_OUT_OF_HORIZON
      - PROVIDER_NOT_ELIGIBLE
      - IDEMPOTENCY_KEY_REUSED
      - TRANSIENT_CONFLICT
      - INTERNAL_ERROR
      title: ErrorCode
      description: 'Машинні коди помилок. Значення не перейменовуються: це частина контракту.'
    FieldError:
      properties:
        field:
          type: string
          title: Field
          description: 'Шлях до поля: розташування (body, query, path, header) і назва.'
          examples:
          - body.slot_id
        message:
          type: string
          title: Message
          description: Що не так із полем.
          examples:
          - Field required
        type:
          type: string
          title: Type
          description: Машинний тип помилки валідації (Pydantic).
          examples:
          - missing
      type: object
      required:
      - field
      - message
      - type
      title: FieldError
      description: Помилка одного поля запиту. Значення, яке надіслав клієнт, не повертається (CWE-209).
    HealthOut:
      properties:
        status:
          type: string
