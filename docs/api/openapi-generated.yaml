        full_name:
          type: string
          title: Full Name
          description: Повне ім'я.
          examples:
          - Ірина Шевченко
      type: object
      required:
      - id
      - full_name
      title: PersonSummary
      description: 'Ім''я користувача без контактних даних (SEC-004: мінімум персональних даних).'
    Problem:
