  /api/v1/bookings:
    post:
      tags:
      - bookings
      summary: Забронювати вільний слот
      description: |-
        Бронює вільний слот для студента; бронювання активне одразу, без підтвердження
        провайдером (FR-030, FR-031). Відповідь містить граничний час скасування (FR-041).

        Відмови (409) пояснюють причину: слот зайнятий — зокрема, якщо двоє бронюють його
        одночасно, рівно один отримує 201 (FR-032, REL-001); слот почався (A-006) або поза
        горизонтом (A-001); ліміт активних бронювань (A-002, поля `limit` і
        `active_bookings`); перетин із власним бронюванням (FR-035).
      operationId: create_booking
      security:
      - demoBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{8,64}$
          - type: 'null'
          description: Необов'язковий ключ ідемпотентності (8–64 символи). Повтор із тим самим ключем
            повертає перше бронювання замість створення нового.
          title: Idempotency-Key
        description: Необов'язковий ключ ідемпотентності (8–64 символи). Повтор із тим самим ключем повертає
          перше бронювання замість створення нового.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
            examples:
              free:
                summary: Вільний слот → 201
                value:
                  slot_id: e3b8b6ab-fc35-4091-90f0-2500b6a546a4
              taken:
                summary: Слот зайнятий іншим студентом → 409
                value:
                  slot_id: 620cd53b-a9d3-4873-9e19-3ca78f0b389b
              started:
                summary: Слот уже почався → 409
                value:
                  slot_id: 969a37c9-bc30-482e-9825-6da114829ebb
              overlap:
                summary: Перетин із власним бронюванням → 409
                value:
                  slot_id: 6ec279e0-7ad1-47e1-a58c-0c4059786639
      responses:
        '201':
          description: Бронювання створено (або повернуто перше за тим самим Idempotency-Key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
          headers:
            Location:
              description: Адреса створеного бронювання.
              schema:
                type: string
            Idempotent-Replayed:
              description: '`true`, якщо це повтор запиту з тим самим Idempotency-Key і нове бронювання
                не створювалося.'
              schema:
                type: string
                enum:
                - 'true'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |-
            Можливі причини:

            - `SLOT_NOT_FOUND` — Слот не знайдено
          content:
            application/problem+json:
              examples:
                SLOT_NOT_FOUND:
                  summary: Слот не знайдено
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#slot-not-found
                    title: Слот не знайдено
                    status: 404
                    detail: Слота з таким ідентифікатором немає.
                    code: SLOT_NOT_FOUND
                    action: Знайдіть актуальний вільний слот через пошук.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |-
            Можливі причини:

            - `SLOT_ALREADY_BOOKED` — Слот уже зайнятий
            - `SLOT_STARTED` — Слот уже почався
            - `SLOT_OUT_OF_HORIZON` — Слот поза горизонтом бронювання
            - `SLOT_BLOCKED` — Час слота заблоковано провайдером
            - `BOOKING_LIMIT_REACHED` — Досягнуто ліміту активних бронювань
            - `BOOKING_OVERLAP` — Час перетинається з іншим вашим бронюванням
          content:
            application/problem+json:
              examples:
                SLOT_ALREADY_BOOKED:
                  summary: Слот уже зайнятий
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#slot-already-booked
                    title: Слот уже зайнятий
                    status: 409
                    detail: На слот уже є активне бронювання, зокрема якщо його щойно зайняв інший студент.
                    code: SLOT_ALREADY_BOOKED
                    action: Оберіть інший вільний слот у пошуку.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                SLOT_STARTED:
                  summary: Слот уже почався
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#slot-started
                    title: Слот уже почався
                    status: 409
                    detail: Запис на слот або зміна бронювання після початку слота.
                    code: SLOT_STARTED
                    action: Оберіть слот, який ще не почався.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                SLOT_OUT_OF_HORIZON:
                  summary: Слот поза горизонтом бронювання
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#slot-out-of-horizon
                    title: Слот поза горизонтом бронювання
                    status: 409
                    detail: Початок слота пізніший за поточний момент плюс горизонт A-001.
                    code: SLOT_OUT_OF_HORIZON
                    action: Оберіть слот у межах горизонту бронювання (A-001).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                SLOT_BLOCKED:
                  summary: Час слота заблоковано провайдером
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#slot-blocked
                    title: Час слота заблоковано провайдером
                    status: 409
                    detail: Слот потрапляє в проміжок, який провайдер оголосив недоступним.
                    code: SLOT_BLOCKED
                    action: Оберіть інший слот.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                BOOKING_LIMIT_REACHED:
                  summary: Досягнуто ліміту активних бронювань
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#booking-limit-reached
                    title: Досягнуто ліміту активних бронювань
                    status: 409
                    detail: Ліміт — 3 активні бронювання, у вас уже 3.
                    code: BOOKING_LIMIT_REACHED
                    action: Скасуйте одне з активних бронювань або дочекайтеся його завершення.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    limit: 3
                    active_bookings: 3
                BOOKING_OVERLAP:
                  summary: Час перетинається з іншим вашим бронюванням
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#booking-overlap
                    title: Час перетинається з іншим вашим бронюванням
                    status: 409
                    detail: Новий слот перетинається в часі з активним бронюванням того самого студента.
                    code: BOOKING_OVERLAP
                    action: Оберіть слот, що не перетинається з вашими активними бронюваннями.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
            - `IDEMPOTENCY_KEY_REUSED` — Ключ ідемпотентності вже використано для іншого запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    errors:
                    - field: body.slot_id
                      message: Field required
                      type: missing
                IDEMPOTENCY_KEY_REUSED:
                  summary: Ключ ідемпотентності вже використано для іншого запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#idempotency-key-reused
                    title: Ключ ідемпотентності вже використано для іншого запиту
                    status: 422
                    detail: Повтор із тим самим Idempotency-Key, але з іншим тілом запиту.
                    code: IDEMPOTENCY_KEY_REUSED
                    action: Для нового запиту згенеруйте новий Idempotency-Key.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          content:
            application/problem+json:
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Взаємне блокування транзакцій не зникло після одного повтору (ADR-002, п.
                      6). У заглушках Лаб 4 не виникає, але є частиною контракту.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
