# ЗГЕНЕРОВАНО з коду src/api/ (FastAPI, Code-First). Не редагуйте вручну:
# змініть код і запустіть `python scripts/export_openapi.py` або сервер.
openapi: 3.1.0
info:
  title: UniSlot API
  summary: Бронювання консультацій викладачів і навчальних аудиторій.
  description: |
    REST API системи бронювання консультацій та аудиторій **UniSlot** (команда SSDM_12, НаУКМА).

    Специфікацію **згенеровано з коду** (FastAPI, підхід Code-First) — вручну її не редагують.
    Проєктні рішення — `docs/api/api-design.md`, атрибути якості — `docs/api/quality-attributes.md`.

    **Лаб 4: заглушки.** Відповіді будуються з демо-даних у пам'яті; правила бронювання
    перевіряються, але дані не зберігаються між перезапусками сервера.

    **Автентифікація (заглушка).** Натисніть «Authorize» і введіть демо-токен:
    `demo-student`, `demo-student-2`, `demo-provider`, `demo-provider-2` або `demo-admin`.

    **Помилки.** Усі відмови — `application/problem+json` (RFC 9457) з полями `code`,
    `action` і `request_id`; поле `type` веде в каталог помилок.

    **Пагінація.** Каталоги — `limit`/`offset`; пошук слотів — курсор `next_cursor`.
    Розмір сторінки — не більше 100.

    **Час.** Усі моменти часу — RFC 3339 в UTC; фільтр `date` у пошуку — дата за Києвом (A-007).
  contact:
    name: Команда SSDM_12
    url: https://github.com/ukma-fin-ssdm-2026/SSDM_12
  version: 1.0.0-alpha.1
servers:
- url: http://localhost:3000
  description: Локальний запуск (uvicorn, порт 3000)
paths:
  /health:
    get:
      tags:
      - service
      summary: Перевірити, що API працює
      description: |-
        Повертає `ok` і версію контракту. Використовується моніторингом і healthcheck
        контейнера; не звертається до сховища, тож відповідає навіть за проблем із даними.
      operationId: get_health
      responses:
        '200':
          description: Процес API працює й приймає запити.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Отримати поточного користувача
      description: |-
        Повертає ідентифікатор, ім'я, e-mail і ролі користувача, від імені якого надіслано
        запит. Клієнт використовує ролі, щоб показати лише доступні дії; перевіряє права
        все одно сервер (deny-by-default).
      operationId: get_me
      responses:
        '200':
          description: Поточний користувач і його ролі.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
      security:
      - demoBearer: []
  /api/v1/resources:
    get:
      tags:
      - resources
      summary: Переглянути каталог ресурсів
      description: |-
        Каталог ресурсів із фільтрами за типом і провайдером. Використовується для вибору
        фільтрів пошуку (FR-021). Пагінація за зсувом: каталог малий, а інтерфейсу потрібна
        загальна кількість (`total`).
      operationId: list_resources
      security:
      - demoBearer: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ResourceType'
          - type: 'null'
          description: Лише ресурси цього типу.
          title: Type
        description: Лише ресурси цього типу.
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Лише ресурси цього провайдера.
          title: Provider Id
        description: Лише ресурси цього провайдера.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Скільки елементів повернути (1–100).
          default: 20
          title: Limit
        description: Скільки елементів повернути (1–100).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          description: Скільки елементів пропустити від початку списку.
          default: 0
          title: Offset
        description: Скільки елементів пропустити від початку списку.
      responses:
        '200':
          description: Сторінка каталогу ресурсів.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    errors:
                    - field: query.limit
                      message: Input should be less than or equal to 100
                      type: less_than_equal
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/resources/{resource_id}:
    get:
      tags:
      - resources
      summary: Отримати ресурс
      description: Повертає один ресурс каталогу з провайдером. Неіснуючий ідентифікатор — 404.
      operationId: get_resource
      security:
      - demoBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор ресурсу (UUID).
          title: Resource Id
        description: Ідентифікатор ресурсу (UUID).
        examples:
          room:
            summary: Аудиторія 1-225 (місткість 30)
            value: a9877c74-ace0-4fb3-8703-c97776347c65
          consultation:
            summary: Консультація з баз даних (без місткості)
            value: e5a7657b-0de4-4984-92f4-72b74ade3e3a
      responses:
        '200':
          description: Ресурс із провайдером.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '404':
          description: |-
            Можливі причини:

            - `RESOURCE_NOT_FOUND` — Ресурс не знайдено
          content:
            application/problem+json:
              examples:
                RESOURCE_NOT_FOUND:
                  summary: Ресурс не знайдено
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#resource-not-found
                    title: Ресурс не знайдено
                    status: 404
                    detail: Ресурсу (консультації чи аудиторії) з таким ідентифікатором немає.
                    code: RESOURCE_NOT_FOUND
                    action: Оберіть ресурс із каталогу GET /api/v1/resources.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    errors:
                    - field: path.resource_id
                      message: 'Input should be a valid UUID, invalid length: found 3'
                      type: uuid_parsing
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/admin/resources:
    post:
      tags:
      - resources
      summary: Створити ресурс (адміністратор)
      description: |-
        Створює консультацію або аудиторію й призначає провайдера (FR-060, FR-061).
        Місткість обов'язкова лише для аудиторії (INV-08); провайдер має мати роль
        «провайдер» (INV-15). Дія потрапляє в журнал аудиту (FR-066).
      operationId: create_resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreate'
            examples:
              room:
                summary: Аудиторія з місткістю
                value:
                  name: Аудиторія 2-110
                  type: room
                  capacity: 24
                  provider_id: 6aafc85c-a8aa-4ae7-bd80-dba04d79baa3
              consultation:
                summary: Консультація без місткості
                value:
                  name: Консультація з алгоритмів
                  type: consultation
                  provider_id: 70acfde3-99e4-4c20-93e1-aeaf0af2cfec
              not_provider:
                summary: 'Помилка: провайдер — студент (422)'
                value:
                  name: Аудиторія 2-111
                  type: room
                  capacity: 20
                  provider_id: 3c357b14-bd0d-424b-8924-17eb737a4907
        required: true
      responses:
        '201':
          description: Ресурс створено; заголовок Location містить його адресу.
          headers:
            Location:
              description: Адреса створеного ресурсу.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
            - `PROVIDER_NOT_ELIGIBLE` — Користувач не може бути провайдером ресурсу
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                    errors:
                    - field: body.capacity
                      message: Value error, для аудиторії (room) місткість обов'язкова
                      type: value_error
                PROVIDER_NOT_ELIGIBLE:
                  summary: Користувач не може бути провайдером ресурсу
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#provider-not-eligible
                    title: Користувач не може бути провайдером ресурсу
                    status: 422
                    detail: provider_id вказує на неіснуючого користувача або на користувача без ролі
                      провайдера.
                    code: PROVIDER_NOT_ELIGIBLE
                    action: Призначте користувача з роллю «провайдер».
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
      security:
      - demoBearer: []
  /api/v1/admin/resources/{resource_id}:
    patch:
      tags:
      - resources
      summary: Змінити ресурс (адміністратор)
      description: |-
        Змінює лише передані поля (семантика PATCH): відсутнє поле не чіпається, а `null`
        для обов'язкового поля — помилка 422, а не «тихе» ігнорування. Тип ресурсу змінити
        не можна. Дія потрапляє в журнал аудиту з попередніми й новими значеннями (FR-066).
      operationId: update_resource
      security:
      - demoBearer: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ідентифікатор ресурсу (UUID).
          title: Resource Id
        description: Ідентифікатор ресурсу (UUID).
        examples:
          room:
            summary: Аудиторія 1-225 (місткість 30)
            value: a9877c74-ace0-4fb3-8703-c97776347c65
          consultation:
            summary: Консультація з баз даних (без місткості)
            value: e5a7657b-0de4-4984-92f4-72b74ade3e3a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdate'
            examples:
              capacity:
                summary: Змінити місткість аудиторії
                value:
                  capacity: 28
              provider:
                summary: Призначити іншого провайдера
                value:
                  provider_id: 70acfde3-99e4-4c20-93e1-aeaf0af2cfec
              null_name:
                summary: 'Помилка: name = null (422)'
                value: {}
      responses:
        '200':
          description: Ресурс після змін.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: |-
            Можливі причини:

            - `RESOURCE_NOT_FOUND` — Ресурс не знайдено
          content:
            application/problem+json:
              examples:
                RESOURCE_NOT_FOUND:
                  summary: Ресурс не знайдено
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#resource-not-found
                    title: Ресурс не знайдено
                    status: 404
                    detail: Ресурсу (консультації чи аудиторії) з таким ідентифікатором немає.
                    code: RESOURCE_NOT_FOUND
