          description: '`ok`, якщо процес приймає запити.'
        version:
          type: string
          title: Version
          description: Версія контракту API.
          examples:
          - 1.0.0-alpha.1
      type: object
      required:
      - status
      - version
      title: HealthOut
      description: Стан процесу API.
    MeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Ідентифікатор користувача.
          examples:
          - 3c357b14-bd0d-424b-8924-17eb737a4907
        full_name:
          type: string
          title: Full Name
          description: Повне ім'я.
          examples:
