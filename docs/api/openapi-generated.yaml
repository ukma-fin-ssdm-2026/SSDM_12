# ЗГЕНЕРОВАНО з коду src/api/ (FastAPI, Code-First). Не редагуйте вручну:
# змініть код і запустіть `python scripts/export_openapi.py` або сервер.
openapi: 3.1.0
info:
  title: UniSlot API
  summary: Бронювання консультацій викладачів і навчальних аудиторій.
  description: |
    REST API системи бронювання консультацій та аудиторій **UniSlot** (команда SSDM_12, НаУКМА).

    Специфікацію **згенеровано з коду** (FastAPI, підхід Code-First) — вручну її не редагують.
    Проєктні рішення — `docs/api/api-design.md`, атрибути якості — `docs/api/quality-attributes.md`.

    **Сховище.** Без `UNISLOT_DATABASE_URL` працює демо-адаптер у пам'яті. З цією
    змінною API використовує мігровану PostgreSQL: дані та outbox зберігаються після
    перезапуску. Окремий Worker доставляє повідомлення в локальну скриньку (C-002).

    **Автентифікація.** POST `/auth/register` і `/auth/login` створюють обліковий запис і cookie-сесію.
    Для змін із cookie потрібен X-CSRF-Token; demoBearer доступний лише за `UNISLOT_DEMO_AUTH=1`.

    **Помилки.** Усі відмови — `application/problem+json` (RFC 9457) з полями `code`,
    `action` і `request_id`; поле `type` веде в каталог помилок.

    **Пагінація.** Каталоги — `limit`/`offset`; пошук слотів — курсор `next_cursor`.
    Розмір сторінки — не більше 100.

    **Час.** Усі моменти часу — RFC 3339 в UTC; фільтр `date` у пошуку — дата за Києвом (A-007).
  contact:
    name: Команда SSDM_12
    url: https://github.com/ukma-fin-ssdm-2026/SSDM_12
  version: 1.0.0-alpha.1
servers:
- url: http://localhost:3000
  description: Локальний запуск (uvicorn, порт 3000)
paths:
  /health:
    get:
      tags:
      - service
      summary: Перевірити, що API працює
      description: |-
        Повертає `ok` і версію контракту. Використовується моніторингом і healthcheck
        контейнера; не звертається до сховища, тож відповідає навіть за проблем із даними.
      operationId: get_health
      responses:
        '200':
          description: Процес API працює й приймає запити.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOut'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Отримати поточного користувача
      description: |-
        Повертає ідентифікатор, ім'я, e-mail і ролі користувача, від імені якого надіслано
        запит. Клієнт використовує ролі, щоб показати лише доступні дії; перевіряє права
        все одно сервер (deny-by-default).
      operationId: get_me
      responses:
        '200':
          description: Поточний користувач і його ролі.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          content:
            application/problem+json:
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
      security:
      - demoBearer: []
      - sessionCookie: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Зареєструвати обліковий запис студента
      description: |-
        Створює лише student незалежно від переданих role/roles. Адреса порівнюється
        без регістру; пароль хешується Argon2id без обрізання. Володіння поштою не
        підтверджується за C-002. Для входу після реєстрації викличте /auth/login.
      operationId: register_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
            examples:
              student:
                summary: Новий студент; введіть власний пароль
                value:
                  full_name: Тестовий студент
                  email: student@example.com
                  password: ''
        required: true
      responses:
        '201':
          description: Новий користувач із єдиною роллю student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '403':
          description: |-
            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CSRF_FAILED:
                  summary: Не пройдено перевірку запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#csrf-failed
                    title: Не пройдено перевірку запиту
                    status: 403
                    detail: Джерело запиту або CSRF-токен не пройшли перевірку.
                    code: CSRF_FAILED
                    action: Оновіть сторінку та передайте чинний X-CSRF-Token.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '409':
          description: |-
            Можливі причини:

            - `EMAIL_ALREADY_REGISTERED` — Адреса вже зареєстрована
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                EMAIL_ALREADY_REGISTERED:
                  summary: Адреса вже зареєстрована
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#email-already-registered
                    title: Адреса вже зареєстрована
                    status: 409
                    detail: Обліковий запис із цією адресою вже існує (порівняння без регістру).
                    code: EMAIL_ALREADY_REGISTERED
                    action: Увійдіть або використайте іншу адресу.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Увійти з адресою та паролем
      description: |-
        Видає нову cookie-сесію, попередню поточну сесію відкликає. Однакова помилка
        для відсутньої адреси й неправильного пароля. Обмеження спроб зберігається в БД;
        параметри локальні до рішення OQ-001. Запити входу приймаються лише як JSON.
      operationId: login_user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
            examples:
              student:
                summary: Раніше зареєстрований студент; введіть свій пароль
                value:
                  email: student@example.com
                  password: ''
        required: true
      responses:
        '200':
          description: Користувач, CSRF-токен та HttpOnly cookie-сесія.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOut'
        '401':
          description: |-
            Можливі причини:

            - `INVALID_CREDENTIALS` — Не вдалося увійти
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_CREDENTIALS:
                  summary: Не вдалося увійти
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#invalid-credentials
                    title: Не вдалося увійти
                    status: 401
                    detail: Неправильна адреса або пароль.
                    code: INVALID_CREDENTIALS
                    action: Перевірте адресу та пароль.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '403':
          description: |-
            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CSRF_FAILED:
                  summary: Не пройдено перевірку запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#csrf-failed
                    title: Не пройдено перевірку запиту
                    status: 403
                    detail: Джерело запиту або CSRF-токен не пройшли перевірку.
                    code: CSRF_FAILED
                    action: Оновіть сторінку та передайте чинний X-CSRF-Token.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '429':
          description: |-
            Можливі причини:

            - `LOGIN_THROTTLED` — Забагато спроб входу
          headers:
            Retry-After:
              description: Залишок тимчасового обмеження входу в секундах.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                LOGIN_THROTTLED:
                  summary: Забагато спроб входу
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#login-throttled
                    title: Забагато спроб входу
                    status: 429
                    detail: Тимчасово обмежено спроби входу. Спробуйте пізніше.
                    code: LOGIN_THROTTLED
                    action: Зачекайте час, указаний у Retry-After.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Вийти з поточної сесії
      description: |-
        Відкликає серверну сесію та видаляє cookie. Для cookie-автентифікації потрібен
        X-CSRF-Token; чужі активні сесії цього користувача залишаються чинними.
      operationId: logout_user
      responses:
        '204':
          description: Сесію відкликано, обидві cookie видалено.
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '403':
          description: |-
            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту

            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CSRF_FAILED:
                  summary: Не пройдено перевірку запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#csrf-failed
                    title: Не пройдено перевірку запиту
                    status: 403
                    detail: Джерело запиту або CSRF-токен не пройшли перевірку.
                    code: CSRF_FAILED
                    action: Оновіть сторінку та передайте чинний X-CSRF-Token.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '422':
          description: |-
            Можливі причини:

            - `VALIDATION_FAILED` — Некоректні дані запиту
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_FAILED:
                  summary: Некоректні дані запиту
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#validation-failed
                    title: Некоректні дані запиту
                    status: 422
                    detail: 'Запит не пройшов валідацію: перевірте поля, перелічені в errors.'
                    code: VALIDATION_FAILED
                    action: Виправте поля, перелічені в errors, і повторіть запит.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
        '503':
          description: |-
            Можливі причини:

            - `TRANSIENT_CONFLICT` — Тимчасовий конфлікт, спробуйте ще раз
          content:
            application/problem+json:
              examples:
                TRANSIENT_CONFLICT:
                  summary: Тимчасовий конфлікт, спробуйте ще раз
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#transient-conflict
                    title: Тимчасовий конфлікт, спробуйте ще раз
                    status: 503
                    detail: Транзакцію не завершено через недоступність БД, конфлікт блокувань або відмову
                      обмеження цілісності. Повтор бронювання виконуйте з тим самим Idempotency-Key.
                    code: TRANSIENT_CONFLICT
                    action: Повторіть запит через кілька секунд (див. заголовок Retry-After).
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            Retry-After:
              description: Через скільки секунд повторити запит.
              schema:
                type: integer
      security:
      - demoBearer: []
      - sessionCookie: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: Обов'язковий для cookie-сесії; значення з /auth/login або unislot_csrf cookie. Для
          явно ввімкненого demoBearer не потрібний.
        schema:
          type: string
          minLength: 43
          maxLength: 43
  /api/v1/resources:
    get:
      tags:
      - resources
      summary: Переглянути каталог ресурсів
      description: |-
        Каталог ресурсів із фільтрами за типом і провайдером. Використовується для вибору
        фільтрів пошуку (FR-021). Пагінація за зсувом: каталог малий, а інтерфейсу потрібна
        загальна кількість (`total`).
      operationId: list_resources
      security:
      - demoBearer: []
      - sessionCookie: []
      parameters:
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ResourceType'
          - type: 'null'
          description: Лише ресурси цього типу.
          title: Type
        description: Лише ресурси цього типу.
      - name: provider_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
