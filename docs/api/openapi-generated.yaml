                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
