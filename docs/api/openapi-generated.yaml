      description: |-
        Створює разовий слот на **власному** ресурсі провайдера (FR-010). Тривалість —
        у межах A-005, початок — у майбутньому. Слот, що перетинається з наявним слотом
        ресурсу, відхиляється (409, FR-011); суміжні слоти дозволені.
      operationId: create_slot
      security:
      - demoBearer: []
      - sessionCookie: []
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Ресурс провайдера, на якому створюється слот.
          title: Resource Id
        description: Ресурс провайдера, на якому створюється слот.
        examples:
          own:
            summary: 'Власний ресурс demo-provider: консультація з баз даних'
            value: e5a7657b-0de4-4984-92f4-72b74ade3e3a
          foreign:
            summary: Ресурс іншого провайдера (demo-provider-2) → 403
            value: decb8af8-560b-47e3-bedd-89e5c4fabf95
      - name: X-CSRF-Token
        in: header
        required: false
        description: Обов'язковий для cookie-сесії; значення з /auth/login або unislot_csrf cookie. Для
          явно ввімкненого demoBearer не потрібний.
        schema:
          type: string
          minLength: 43
          maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotCreate'
            examples:
              ok:
                summary: 30 хвилин, київський час
                value:
                  starts_at: '2027-02-15T10:00:00+02:00'
                  duration_minutes: 30
              bad_duration:
                summary: 'Помилка: тривалість 17 хв (422)'
                value:
                  starts_at: '2027-02-15T10:00:00+02:00'
                  duration_minutes: 17
              naive_time:
                summary: 'Помилка: час без часового поясу (422)'
                value:
                  starts_at: '2027-02-15T10:00:00'
                  duration_minutes: 30
      responses:
        '201':
          description: Слот створено; заголовок Location містить його адресу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDetail'
          headers:
            Location:
              description: Адреса створеного слота.
              schema:
                type: string
        '401':
          description: |-
            Можливі причини:

            - `AUTH_REQUIRED` — Потрібна автентифікація
          content:
            application/problem+json:
              examples:
                AUTH_REQUIRED:
                  summary: Потрібна автентифікація
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#auth-required
                    title: Потрібна автентифікація
                    status: 401
                    detail: Запит без токена, з невідомим токеном або з вимкненою демо-автентифікацією.
                    code: AUTH_REQUIRED
                    action: 'Увійдіть у систему. У Лаб 4 — передайте демо-токен: Authorization: Bearer
                      demo-student.'
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
              schema:
                $ref: '#/components/schemas/Problem'
          headers:
            WWW-Authenticate:
              description: 'Схема автентифікації: Bearer.'
              schema:
                type: string
        '403':
          description: |-
            Можливі причини:

            - `FORBIDDEN_ROLE` — Недостатньо прав для цієї операції
            - `NOT_OWNER` — Об'єкт належить іншому користувачу

            Можливі причини:

            - `CSRF_FAILED` — Не пройдено перевірку запиту
          content:
            application/problem+json:
              examples:
                FORBIDDEN_ROLE:
                  summary: Недостатньо прав для цієї операції
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#forbidden-role
                    title: Недостатньо прав для цієї операції
                    status: 403
                    detail: Роль користувача не дозволяє операцію (deny-by-default).
                    code: FORBIDDEN_ROLE
                    action: Скористайтеся обліковим записом із потрібною роллю або зверніться до адміністратора.
                    request_id: 4f6c0b9e2d7a4e51a3c8d1f0b2e47a96
                NOT_OWNER:
                  summary: Об'єкт належить іншому користувачу
                  value:
                    type: https://ukma-fin-ssdm-2026.github.io/SSDM_12/errors.html#not-owner
                    title: Об'єкт належить іншому користувачу
                    status: 403
                    detail: Студент звертається до чужого бронювання або провайдер — до чужого ресурсу.
