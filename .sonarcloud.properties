# Налаштування Automatic Analysis для SSDM_12 (Лаб 8).
# Automatic Analysis ігнорує sonar-project.properties — читається саме цей файл,
# і лише з гілки за замовчуванням. Підстановні символи не дозволені.

# Версія мови: без неї аналізатор бере застарілі сигнатури залежностей
# (звідси хибне спрацювання на get_openapi(summary=...) у src/api/main.py).
sonar.python.version=3.12

# Продуктовий код і тести розділено: правила для тестів інші.
sonar.sources=src,scripts
sonar.tests=tests

# Заморожений доказ спайка ADR-002 (Лаб 3) зберігається дослівно й уже
# виключений з Ruff у pyproject.toml — узгоджуємо область аналізу.
sonar.exclusions=docs/architecture/validation

sonar.sourceEncoding=UTF-8
